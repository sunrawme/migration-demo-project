name: Jenkins Migration CI-CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: migration-pipeline
  IMAGE_TAG: ${{ github.sha }}

jobs:

  build-test-push:

    name: Build, Test and Push

    runs-on: ubuntu-latest

    steps:

      # --------------------------------
      # Checkout
      # --------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------
      # Node.js
      # --------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # --------------------------------
      # Install dependencies
      # --------------------------------
      - name: Install dependencies
        run: npm install

      # --------------------------------
      # Run tests
      # --------------------------------
      - name: Run tests
        run: npm test

      # --------------------------------
      # Debug GitHub OIDC information
      # TEMPORARY - REMOVE AFTER FIXING OIDC
      # --------------------------------
      - name: Debug OIDC Information
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "========== GitHub OIDC Debug =========="
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Repository owner: $GITHUB_REPOSITORY_OWNER"
          echo "Repository ID: ${{ github.repository_id }}"
          echo "Repository owner ID: ${{ github.repository_owner_id }}"
          echo "Ref: $GITHUB_REF"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "======================================="

      # --------------------------------
      # Configure AWS credentials
      # --------------------------------
      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/GithubActionMigrationRole
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------
      # Verify AWS identity
      # --------------------------------
      - name: Verify AWS identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "AWS identity:"
          aws sts get-caller-identity

      # --------------------------------
      # Login to Amazon ECR
      # --------------------------------
      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------
      # Build Docker image
      # --------------------------------
      - name: Build Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "Building Docker image..."

          docker build \
            -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

      # --------------------------------
      # Push Docker image
      # --------------------------------
      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "Pushing Docker image..."

          docker push \
            $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG


  # ============================================================
  # DEPLOY
  # ============================================================

  deploy:

    name: Deploy to Application EC2

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs:
      - build-test-push

    runs-on: ubuntu-latest

    steps:

      # --------------------------------
      # Configure AWS credentials
      # --------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/GithubActionMigrationRole
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------
      # Verify AWS identity
      # --------------------------------
      - name: Verify AWS identity
        run: |
          echo "AWS identity:"
          aws sts get-caller-identity

      # --------------------------------
      # Deploy using AWS Systems Manager
      # --------------------------------
      - name: Deploy using AWS Systems Manager
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com

        run: |

          echo "Deploying to EC2..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="[
              \"aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY\",
              \"docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG\",
              \"docker stop app || true\",
              \"docker rm app || true\",
              \"docker run -d --name app -p 8082:8080 $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "Waiting for deployment..."

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          echo "Deployment completed."


      # --------------------------------
      # Smoke test
      # --------------------------------
      - name: Smoke test
        env:
          EC2_PUBLIC_IP: ${{ vars.EC2_PUBLIC_IP }}

        run: |

          echo "Running application health check..."

          sleep 5

          curl --fail \
            http://$EC2_PUBLIC_IP:8082/health

          echo ""
          echo "Smoke test passed!"
